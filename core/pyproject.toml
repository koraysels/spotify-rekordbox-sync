[project]
name = "rbsync"
version = "0.1.1"
description = "Sync Spotify playlists into the rekordbox master database"
requires-python = ">=3.12"
dependencies = [
    "pyrekordbox>=0.4.4",
    "httpx>=0.27",
    "psutil>=6.0",
]

[project.scripts]
rbsync = "rbsync.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
